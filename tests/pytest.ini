# =================================================================================================
# Dockerized-NorLab project application (DNA) (project-ci-tests entrypoint required file)
#
# Ini option ref: https://docs.pytest.org/en/7.1.x/reference/reference.html#ini-options-ref
# =================================================================================================

[pytest]
minversion = 7.2.2
required_plugins =
    pytest-xdist>=3.8.0
    pytest-env
    pytest-rerunfailures
env =
    LOADED_ENV_FROM_PYTEST_INI=loaded like a boss
    DNA_PYTEST_CI_RUN=True
testpaths =
    tests
markers =
    automated_test: mark a test when executed from a test suite.
    slow: mark test as slow.
    long_run: mark test as a long running integration test (e.g., full training pipeline regression monitoring).
addopts =
; ....Skip long running tests......................
; Skips all tests decorated with @pytest.mark.long_run and @pytest.mark.slow
    -m "not long_run and not slow"
;    -m "not long_run"
; ....Disable plugin...............................
    -p no:randomly
    -p no:benchmark
;    -p no:rerunfailures
; Disable ROS2 launch_testing pytest plugins (auto-loaded via setuptools entrypoints).
; They are incompatible with modern pytest (>=8) and crash the CI session:
;   - `launch_testing` (launch_testing.pytest.hooks) declares the legacy
;     `pytest_pycollect_makemodule(path, parent)` hookimpl using the removed `path`
;     argument -> PluginValidationError at startup.
;   - `launch_ros` (launch_testing_ros_pytest_entrypoint) implements the
;     `pytest_launch_collect_makemodule` hook (whose hookspec lives in `launch_testing`)
;     -> "unknown hook" PluginValidationError once `launch_testing` is disabled.
; These plugins are only needed for ros2_packages tests, which CI already excludes.
    -p no:launch_testing
    -p no:launch_ros
; ....pystest-xdist................................
; Doc: https://pytest-xdist.readthedocs.io
; Note: not compatible with pytest-benchmark
; Flag: --numprocesses [<number-of-worker>|auto|logical]
; Flag: --maxprocesses=<number-of-worker>
; Flag: --dist [no|loadscope|loadfile|loadgroup]
; - no: disable pystest-xdist
; - loadscope: Tests are grouped by module for test functions and by class for test methods.
; - loadfile: This guarantees that all tests in a file run in the same worker.
; - loadgroup: Tests are grouped by `xdist_group` mark. eg @pytest.mark.xdist_group(name="group1")
    --numprocesses auto
    --dist loadgroup
; ....pytest-randomly..............................
;    --randomly-dont-reset-seed
;    --randomly-dont-reorganize
